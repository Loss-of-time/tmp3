name: paper-trade
# paper trading daily run

on:
  schedule:
    # A股收盘 15:00 (UTC+8) 后运行, 留 30 分钟余量 = UTC 07:30, 周一至周五
    - cron: '30 7 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: paper-trade
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: |
          pip install --quiet akshare baostock pandas plotly

      - name: Run paper trading
        run: python3 -u paper_trade_signal.py

      - name: Commit state + report
        run: |
          git config user.name "paper-bot"
          git config user.email "paper-bot@users.noreply.github.com"
          git add paper_signal_state.json docs cache_bt/etf_industry cache_bt/hs300.json
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "paper: $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: run
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
